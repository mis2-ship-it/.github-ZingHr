name: Daily ZingHR Super Employee Master Download

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub interface

jobs:
  download-master:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Browsers
      run: |
        pip install playwright
        playwright install chromium --with-deps

    - name: Execute ZingHR Export Script
      env:
        ZING_COMPANY_CODE: ${{ secrets.ZING_COMPANY_CODE }}
        ZING_USERNAME: ${{ secrets.ZING_USERNAME }}
        ZING_PASSWORD: ${{ secrets.ZING_PASSWORD }}
      run: |
        python download_zinghr_master.py

    - name: Save Downloaded File as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-super-employee-master
        path: downloads/Super_Employee_Master.xlsx
        retention-days: 14
