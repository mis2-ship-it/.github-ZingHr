name: Daily ZingHR Super Employee Master Download

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  export-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install playwright google-api-python-client google-auth
        playwright install chromium --with-deps

    - name: Run Download and Drive Upload
      env:
        ZING_COMPANY_CODE: ${{ secrets.ZING_COMPANY_CODE }}
        ZING_USERNAME: ${{ secrets.ZING_USERNAME }}
        ZING_PASSWORD: ${{ secrets.ZING_PASSWORD }}
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: python download_and_upload.py
